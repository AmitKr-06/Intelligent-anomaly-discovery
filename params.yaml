data_ingestion:
  raw_path: data/raw/ai4i2020.csv   # where the original CSV lives
  test_size: 0.2
  random_state: 42

model_building:
  random_state: 42
  isolation_forest:
    n_estimators: 300
  dbscan:
    eps: 1.0
    min_samples: 14
  gmm:
    n_components: 7
    covariance_type: full
    n_init: 5

model_evaluation:
  review_budgets: [0.01, 0.03, 0.05, 0.10]   # top fractions an analyst would review
  n_bootstrap: 500                            # resamples for confidence intervals
  random_state: 42